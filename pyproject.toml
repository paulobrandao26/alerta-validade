[project]
name = "validade-certa"
version = "0.1.0"
description = "Alerta de produtos perto de vencer para mercados pequenos, com leitura da data por foto (IA)."
requires-python = ">=3.12"
# Mesma lista do requirements.txt (o Vercel instala a partir daqui; o Docker, de lá).
# O teste test_dependencias_iguais garante que as duas listas não se separem.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "python-multipart==0.0.34",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/unitarios", "tests/integracao"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Depends(...) nos parâmetros é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "B017"]
