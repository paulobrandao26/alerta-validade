# Sobe tudo com: docker compose up --build
# API em http://localhost:8000, worker separado e PostgreSQL.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: validade
      POSTGRES_USER: validade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validade -d validade"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://validade:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/validade
      WORKER_EMBUTIDO: "false"
      PASTA_UPLOADS: /app/dados/uploads
    volumes:
      - fotos:/app/dados/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://validade:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/validade
      PASTA_UPLOADS: /app/dados/uploads
    volumes:
      - fotos:/app/dados/uploads
    depends_on:
      api:
        condition: service_started

volumes:
  banco:
  fotos:
